<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Research Assistant</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="app">
    <header class="header">
      <div class="header-inner">
        <h1>Research Assistant</h1>
        <p class="subtitle">Powered by Llama 3.3 · Cloudflare Workers AI</p>
      </div>
      <button id="clear-btn" class="clear-btn" title="Clear history">Clear</button>
    </header>

    <main class="messages" id="messages">
      <div class="empty-state" id="empty-state">
        <div class="empty-icon">🔬</div>
        <p>Ask me anything. I remember our conversations.</p>
      </div>
    </main>

    <footer class="input-area">
      <form id="chat-form" class="input-form">
        <textarea
          id="input"
          class="input-field"
          placeholder="Ask a research question…"
          rows="1"
          autofocus
        ></textarea>
        <button type="submit" id="send-btn" class="send-btn">
          <span id="send-label">Send</span>
          <span id="send-spinner" class="spinner hidden">⟳</span>
        </button>
      </form>
    </footer>
  </div>

  <script>
    // --- User identity (persisted across sessions) ---
    let userId = localStorage.getItem("ra_user_id");
    if (!userId) {
      userId = crypto.randomUUID();
      localStorage.setItem("ra_user_id", userId);
    }

    // --- DOM refs ---
    const messagesEl = document.getElementById("messages");
    const emptyState  = document.getElementById("empty-state");
    const form        = document.getElementById("chat-form");
    const input       = document.getElementById("input");
    const sendBtn     = document.getElementById("send-btn");
    const sendLabel   = document.getElementById("send-label");
    const sendSpinner = document.getElementById("send-spinner");
    const clearBtn    = document.getElementById("clear-btn");

    // --- Helpers ---
    function setLoading(on) {
      sendBtn.disabled = on;
      sendLabel.classList.toggle("hidden", on);
      sendSpinner.classList.toggle("hidden", !on);
      input.disabled = on;
    }

    function hideEmpty() {
      emptyState.style.display = "none";
    }

    function appendMessage(role, text, streaming = false) {
      hideEmpty();
      const wrap = document.createElement("div");
      wrap.className = `message ${role}`;

      const bubble = document.createElement("div");
      bubble.className = "bubble";
      bubble.textContent = text;
      wrap.appendChild(bubble);
      messagesEl.appendChild(wrap);
      messagesEl.scrollTop = messagesEl.scrollHeight;

      if (streaming) {
        // Return setter so we can append tokens
        return (token) => {
          bubble.textContent += token;
          messagesEl.scrollTop = messagesEl.scrollHeight;
        };
      }
    }

    function autoResize() {
      input.style.height = "auto";
      input.style.height = Math.min(input.scrollHeight, 160) + "px";
    }
    input.addEventListener("input", autoResize);

    // --- Load history on startup ---
    async function loadHistory() {
      try {
        const res = await fetch(`https://cf-research-assistant.rohitworkers435.workers.dev/history?userId=${encodeURIComponent(userId)}`);
        if (!res.ok) return;
        const data = await res.json();
        if (data.messages && data.messages.length > 0) {
          data.messages.forEach(msg => appendMessage(msg.role, msg.content));
        }
      } catch (e) {
        console.warn("Could not load history", e);
      }
    }

    // --- Send message ---
    form.addEventListener("submit", async (e) => {
      e.preventDefault();
      const text = input.value.trim();
      if (!text) return;

      input.value = "";
      autoResize();
      setLoading(true);

      appendMessage("user", text);
      const appendToken = appendMessage("assistant", "", true);

      try {
        const res = await fetch("https://cf-research-assistant.rohitworkers435.workers.dev/chat", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ userId, message: text }),
        });

        if (!res.ok || !res.body) {
          appendToken("⚠️ Server error. Please try again.");
          setLoading(false);
          return;
        }

        const reader = res.body.getReader();
        const decoder = new TextDecoder();
        let buffer = "";

        while (true) {
          const { done, value } = await reader.read();
          if (done) break;

          buffer += decoder.decode(value, { stream: true });
          const lines = buffer.split("\n");
          buffer = lines.pop() ?? "";

          for (const line of lines) {
            if (!line.startsWith("data: ")) continue;
            try {
              const payload = JSON.parse(line.slice(6));
              if (payload.token) appendToken(payload.token);
              if (payload.error) appendToken("\n\n⚠️ " + payload.error);
            } catch {}
          }
        }
      } catch (err) {
        appendToken("\n\n⚠️ Connection error: " + err.message);
      } finally {
        setLoading(false);
        input.focus();
      }
    });

    // Submit on Enter (Shift+Enter for newline)
    input.addEventListener("keydown", (e) => {
      if (e.key === "Enter" && !e.shiftKey) {
        e.preventDefault();
        form.requestSubmit();
      }
    });

    // Clear chat
    clearBtn.addEventListener("click", () => {
      if (!confirm("Clear your conversation history?")) return;
      localStorage.removeItem("ra_user_id");
      userId = crypto.randomUUID();
      localStorage.setItem("ra_user_id", userId);
      Array.from(messagesEl.querySelectorAll(".message")).forEach(el => el.remove());
      emptyState.style.display = "";
    });

    // --- Init ---
    loadHistory();
  </script>
</body>
</html>
