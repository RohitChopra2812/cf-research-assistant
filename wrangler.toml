name = "cf-research-assistant"
main = "src/index.ts"
compatibility_date = "2024-12-05"
compatibility_flags = ["nodejs_compat"]

[assets]
directory = "./public"

[ai]
binding = "AI"

[[d1_databases]]
binding = "DB"
database_name = "research-assistant-db"
